---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observatory
  template:
    metadata:
      labels:
        app: observatory
    spec:
      imagePullSecrets:
        - name: nexus-regcred
      containers:
        - name: observatory
          image: 192.168.32.84:8086/istana-president/dashboard-observability:__TAG__
          ports:
            - containerPort: 8766
          env:
            - name: DATA_MODE
              value: "production"
            - name: PORT
              value: "8766"
            - name: PRODUCTION_CONFIG
              value: /app/backend/production.local.json
          envFrom:
            - secretRef:
                name: observatory-env
          volumeMounts:
            - name: config
              mountPath: /app/backend/production.local.json
              subPath: production.local.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8766
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8766
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: observatory-config
---
apiVersion: v1
kind: Service
metadata:
  name: observatory
spec:
  type: NodePort
  selector:
    app: observatory
  ports:
    - port: 8766
      targetPort: 8766
      nodePort: 30083