# LOCAL PROTOTYPE. Add TLS + OIDC gateway before exposing to an internal network.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://signoz.example.org https://kuma.example.org https://matomo.example.org https://superset.example.org; frame-ancestors 'self' https://dashy.example.org; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location / { try_files $uri $uri/ =404; }
  location /api/ {
    proxy_pass http://aggregator:8766;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
